[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satark-ai"
version = "2.2.0"
description = "SATARK AI — Local-first, explainable multilingual digital scam detection and awareness platform in Python & FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<0.125.0",
  "uvicorn>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "python-multipart>=0.0.9,<1.0.0"
]

[project.optional-dependencies]
test = ["httpx>=0.27.0,<0.29.0", "pytest>=8.0.0,<9.0.0"]
dev = ["ruff>=0.11.0,<1.0.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501"]
