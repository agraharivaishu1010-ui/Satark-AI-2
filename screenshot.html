{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Screenshot Validation &amp; Scan</h1>
  <p class="muted">Upload a JPG, PNG, or WebP screenshot (10 MB max) for local MIME/size validation, then paste or edit the visible text below to analyze.</p>
  <form method="post" action="/screenshot" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="screenshot-file">Select Screenshot (JPG, PNG, or WebP)</label>
    <input id="screenshot-file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required />
    <button type="submit" class="btn">Validate Screenshot</button>
  </form>
  {% if notice %}
  <div class="alert-box" role="status" aria-live="polite">{{ notice }}</div>
  {% endif %}
</section>
<section class="card">
  <h2>Review &amp; Scan Visible Text</h2>
  <form method="post" action="/scan">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="ocr-extracted-text">Extracted or Visible Screenshot Text</label>
    <textarea id="ocr-extracted-text" name="text" rows="5" maxlength="5000" required placeholder="Paste or edit visible text from the screenshot...">{{ extracted_text }}</textarea>
    <button type="submit" class="btn">{{ ui.btn_analyze }}</button>
  </form>
</section>
{% endblock %}
